<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- proofstone mark: a chiseled "P" hewn from stone. The 45-degree cuts read
       as a cut-stone edge at large sizes and resolve to a clean, legible P at
       16px. The shape is unchanged; only the paint is.
       MONO wave: the mark pair is PINNED, no longer a mirror of the accent.
       The mono accent is ivory (#f2efe6), and an ivory badge vanishes on a
       white tab bar (1.10:1 where a graphical object needs 3:1). A favicon is
       the one copy of the identity that renders on backgrounds this site does
       not control, so it carries its own measured neutral pair:
         badge #8a8884 - 3.54:1 on a white tab bar, 4.55:1 on a dark one
         glyph #0b0b0c - 5.56:1 against the badge
       The same pinned pair paints the mark inside the OG cards (make-og.mjs
       MARK_BADGE / MARK_INK), and palette-guard asserts the copies are
       identical - pinned both ways, just no longer to --accent. The header
       mark is the opposite case: it sits ON the page and goes through tokens. -->
  <rect width="32" height="32" rx="7" fill="#8a8884"/>
  <path fill="#0b0b0c" fill-rule="evenodd"
        d="M8.5 9.3L10.3 7.5L21.7 7.5L23.5 9.3L23.5 15.7L21.7 17.5L13.5 17.5L13.5 22.8L11.7 24.5L10.3 24.5L8.5 22.8Z
           M13.5 10.6L20 10.6L21.3 11.9L21.3 13.1L20 14.4L13.5 14.4Z"/>
</svg>
